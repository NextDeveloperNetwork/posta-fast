services:
  # ==========================================
  # Posta Fast Next.js Application
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: posta-fast:latest
    container_name: posta-fast-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-4521}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=${DATABASE_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID:-}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET:-}
      - AUTH_GITHUB_ID=${AUTH_GITHUB_ID:-}
      - AUTH_GITHUB_SECRET=${AUTH_GITHUB_SECRET:-}
    networks:
      - posta-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ==========================================
  # Cloudflare Tunnel (Zero Trust / Remote Access)
  # ==========================================
  # Runs cloudflared as a sidecar container.
  # Traffic from your custom domain reaches http://app:3000 securely
  # with no ports open on your firewall or router.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: posta-fast-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-eyJhIjoiZmNhOGY3OTUzOTdmZDk0NDFkYjA0NmI3ZDQ2ODRlMDUiLCJ0IjoiM2U5NWUwNDktODc3Yy00M2I0LTg0MjAtMGI3N2VjYjBiZTEzIiwicyI6IllqazJOakF3WkRNdE9URmtOQzAwTmpBM0xUbGtZV0V0WkRoaU5XTTROekV5WkdGaiJ9}
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-eyJhIjoiZmNhOGY3OTUzOTdmZDk0NDFkYjA0NmI3ZDQ2ODRlMDUiLCJ0IjoiM2U5NWUwNDktODc3Yy00M2I0LTg0MjAtMGI3N2VjYjBiZTEzIiwicyI6IllqazJOakF3WkRNdE9URmtOQzAwTmpBM0xUbGtZV0V0WkRoaU5XTTROekV5WkdGaiJ9}
    networks:
      - posta-net
    depends_on:
      app:
        condition: service_healthy

networks:
  posta-net:
    name: posta-net
    driver: bridge
